<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find It! — Alex's Amazing Garage</title>
  <link rel="stylesheet" href="public/truck-screen.css?v=bays4">
  <style>
    .slot-art img.floor-contact {
      left: var(--contact-x);
      top: var(--contact-top);
      bottom: auto;
      z-index: 1;
      transform: translate(calc(var(--anchor-x) * -1), calc(var(--anchor-y) * -1)) scale(var(--vehicle-scale, 1));
      transform-origin: var(--anchor-x) var(--anchor-y);
    }

    .pick .bay-slot.is-selected .slot-art::after,
    .pick .bay-slot[aria-pressed="true"] .slot-art::after {
      opacity: 0;
    }

    .bay-glow {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .bay-glow polyline {
      fill: none;
      opacity: 0;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .bay-glow .edge { stroke: #061018; stroke-width: 5px; }
    .bay-glow .core {
      stroke: #1677FF;
      stroke-width: 4px;
      filter:
        drop-shadow(0 0 1px rgba(5, 12, 22, 0.9))
        drop-shadow(0 0 5px rgba(22, 119, 255, 0.45))
        drop-shadow(0 0 11px rgba(22, 90, 210, 0.26));
    }

    .pick-stage:has(.bay-1.is-selected) .g1 polyline,
    .pick-stage:has(.bay-2.is-selected) .g2 polyline,
    .pick-stage:has(.bay-3.is-selected) .g3 polyline,
    .pick-stage:has(.bay-4.is-selected) .g4 polyline,
    .pick-stage:has(.bay-5.is-selected) .g5 polyline,
    .pick-stage:has(.bay-6.is-selected) .g6 polyline,
    .pick-stage:has(.bay-7.is-selected) .g7 polyline,
    .pick-stage:has(.bay-8.is-selected) .g8 polyline,
    .pick-stage:has(.bay-9.is-selected) .g9 polyline { opacity: 1; }

    .pick .bay-slot.is-selected .slot-name,
    .pick .bay-slot[aria-pressed="true"] .slot-name {
      color: #FFD43B;
      text-shadow: 0 1px 0 #041018, 0 0 4px rgba(0, 0, 0, 0.9);
    }

    .bay-8 .slot-art img.floor-contact {
      filter: contrast(1.12) brightness(1.07);
      transform: translate(calc(var(--anchor-x) * -1), calc(var(--anchor-y) * -1)) rotate(var(--ground-rotate, 0deg)) scale(var(--vehicle-scale, 1));
    }

    .bay-8 .contact-shadow {
      height: 5%;
      background: radial-gradient(ellipse 100% 100% at 50% 0%, rgba(8, 10, 16, 0.62) 0%, rgba(8, 10, 16, 0.26) 46%, rgba(8, 10, 16, 0) 80%);
    }

    .contact-shadow {
      position: absolute;
      z-index: 0;
      height: 4.2%;
      transform: translate(-50%, 0);
      background: radial-gradient(ellipse 100% 100% at 50% 0%, rgba(8, 10, 16, 0.78) 0%, rgba(8, 10, 16, 0.34) 42%, rgba(8, 10, 16, 0) 78%);
      pointer-events: none;
    }

    .find-actions {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 2.4%;
      display: flex;
      gap: 1vh;
      transform: translateX(-50%);
    }

    .find-garage,
    .find-replay {
      margin: 0;
      border: 0;
      border-radius: 999px;
      padding: 0.8vh 1.6vh;
      background: rgba(6, 16, 36, 0.82);
      color: #fff;
      font: 800 1.8vh/1 "Segoe UI", sans-serif;
      text-decoration: none;
      cursor: pointer;
    }


    .find-copy {
      position: absolute;
      z-index: 4;
      left: 18%;
      right: 18%;
      top: 11.6%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3vh;
      pointer-events: none;
    }

    .find-task,
    .find-feedback {
      margin: 0;
      max-width: 100%;
      padding: 0.35vh 1.2vh;
      border-radius: 8px;
      background: rgba(6, 16, 36, 0.82);
      color: #fff;
      font: 800 2vh/1.15 "Segoe UI", sans-serif;
      text-align: center;
    }

    .find-feedback:empty { display: none; }
    .find-task { color: #FFD43B; }

    /* Matches the unchanged Explore artwork in garage-background-9-bays.png. */
    .find-hit-explore {
      position: absolute;
      z-index: 10;
      display: block;
      left: 54.9%;
      top: 1.2%;
      width: 13.4%;
      height: 9.2%;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      touch-action: manipulation;
    }
    .find-hit-explore:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px;
      border-radius: 15px;
    }
  </style>
<link rel="stylesheet" href="public/css/alex-rewards.css?v=15">
<link rel="stylesheet" href="public/alex-rewards.css?v=wrong-name-v3">

<style id="alex-find-it-watch-mission-v1">
/* Cover the unused painted Say It button with the same button as Garage. */
.pick-stage .alex-garage-top-mission{
 position:absolute!important;z-index:90!important;left:83.85%!important;top:3.87%!important;
 width:14.44%!important;height:6.63%!important;box-sizing:border-box!important;
 border:2px solid #66caff!important;border-radius:999px!important;
 display:flex!important;align-items:center!important;justify-content:center!important;gap:4px!important;
 background:linear-gradient(180deg,#269dff 0%,#0751c7 100%)!important;
 box-shadow:0 3px 0 #003475,0 0 10px #0099ff88,inset 0 1px 0 #ffffff90!important;
 color:white!important;font:900 clamp(10px,1.4vw,20px)/1 'Trebuchet MS','Segoe UI',Arial,sans-serif!important;
 text-shadow:0 1px 2px #062e79!important;cursor:pointer!important;padding:0 3px!important;
 white-space:nowrap!important;touch-action:manipulation;
}
.pick-stage .alex-garage-top-mission:focus-visible{outline:3px solid #ffe16f;outline-offset:2px}
@media(max-width:700px){.pick-stage .alex-garage-top-mission{font-size:clamp(8px,1.6vw,11px)!important;border-width:1px!important}}
</style>
</head>
<body>
  <main class="pick find-it" data-sound="local" data-rights="unconfirmed">
    <h1 class="sr-only">Find It!</h1>
    <div class="pick-stage">
      <img class="pick-bg" src="public/images/garage-background-9-bays.png" alt="" width="1448" height="1086">
      <svg class="bay-glow" viewBox="0 0 1448 1086" preserveAspectRatio="none" aria-hidden="true"></svg>
      <!-- Clickable area on the EXISTING painted Explore button. No new visible controls. -->
      <a class="find-hit-explore" id="find-hit-explore" href="preview/vehicle-explore/explore.html?v=fire-truck" aria-label="Explore selected vehicle"></a>
      <div class="find-copy">
        <p class="find-task" id="find-task" aria-live="polite"></p>
        <p class="find-feedback" id="find-feedback" aria-live="polite"></p>
      </div>
      <div class="find-actions">
        <a class="find-garage" id="find-garage" href="garage.html">Garage</a>
        <button class="find-replay" id="find-replay" type="button">Listen again</button>
        <a class="find-replay" id="find-next" href="#" hidden>Next: Watch Mission →</a>
      </div>
      <div id="bays"></div>
    </div>
  </main>
  <script src="public/js/alex-browser-speech.js"></script>
  <script src="public/js/garage-fleet.js"></script>
  <script src="public/js/alex-awards.js"></script>
  <script src="public/js/alex-awards-finale.js"></script>
  <script src="public/js/alex-rewards.js?v=wrong-name-v3"></script>
  <script src="public/js/find-it.js"></script>

  <script>
    // Only the existing Explore artwork is interactive; Find It logic stays untouched.
    (function () {
      var vehicleIds = ["fire-truck", "airport-fire-truck", "police-car", "excavator", "mobile-crane", "tractor", "dump-truck", "mars-rover", "ambulance"];
      var params = new URLSearchParams(window.location.search);
      var selectedVehicle = params.get("v");
      if (vehicleIds.indexOf(selectedVehicle) === -1) {
        try {
          var index = Number(sessionStorage.getItem("garage-choice"));
          selectedVehicle = Number.isInteger(index) && index >= 0 && index < vehicleIds.length ? vehicleIds[index] : vehicleIds[0];
        } catch (_ignored) {
          selectedVehicle = vehicleIds[0];
        }
      }
      var link = document.getElementById("find-hit-explore");
      link.href = "preview/vehicle-explore/explore.html?v=" + encodeURIComponent(selectedVehicle);
      link.setAttribute("aria-label", "Explore " + selectedVehicle.replace(/-/g, " "));
    })();
  </script>
<script src='public/js/alex-v17-rewards-addon.js'></script>
<script src='public/js/alex-v18-finale.js'></script>

<script id="alex-find-it-watch-mission-script-v1">
(function(){'use strict';
 var stage=document.querySelector('.pick-stage');if(!stage)return;
 var button=document.createElement('button');button.type='button';
 button.className='alex-garage-top-mission';button.textContent='▶ Watch Mission';
 button.setAttribute('aria-label','Watch mission for the selected vehicle');
 button.addEventListener('click',function(){
  var ids=['fire-truck','airport-fire-truck','police-car','excavator','mobile-crane','tractor','dump-truck','mars-rover','ambulance'];
  var params=new URLSearchParams(location.search),selected=params.get('v');
  if(ids.indexOf(selected)===-1){
   var choice=0;try{choice=Number(sessionStorage.getItem('garage-choice'))||0;}catch(e){}
   if(!Number.isInteger(choice)||choice<0||choice>=ids.length)choice=0;
   selected=ids[choice];
  }
  location.assign('vehicle-action/mission-videos/index.html?v='+encodeURIComponent(selected));
 });
 stage.appendChild(button);
})();
</script>
</body>
</html>
