<main class="shell"><header class="top"><a class="nav" href="garage.html">← Garage</a><div class="brand">My Garage Awards</div><a class="nav" href="find-it.html">Find It! →</a></header>

<section class="trophy locked" id="final"><span class="trophy-icon" aria-hidden="true">🏆</span><div><strong>Super Garage Hero!</strong><p id="final-help">Collect all nine vehicles to win the grand trophy.</p></div></section>

<script src="public/js/alex-awards.js"></script>
<script>
(function(){'use strict';
 var awards=window.AlexAwards,got=awards.read(),grid=document.getElementById('grid');
 awards.fleet.forEach(function(item){var unlocked=!!got[item[0]],card=document.createElement('article');card.className='award'+(unlocked?' earned':'');
 var glow=document.createElement('div');glow.className='glow';
 var stage=document.createElement('div');stage.className='stage';
 var image=document.createElement('img');image.className='photo';image.src='public/images/awards/'+item[0]+'.webp';image.alt=item[1];image.loading='lazy';
 stage.append(glow,image);
 var plate=document.createElement('div');plate.className='plate';var name=document.createElement('span');name.className='name';name.textContent=item[1];var mark=document.createElement('span');mark.className='mark';mark.textContent=unlocked?'★ EARNED':'LOCKED';
 plate.append(name,mark);card.append(stage,plate);grid.appendChild(card);
 });
 var n=awards.count();document.getElementById('counter').textContent=n+' / 9 UNLOCKED';document.getElementById('fill').style.width=(n/9*100)+'%';
 if(n===9){document.getElementById('final').classList.remove('locked');document.getElementById('final-help').textContent='Amazing work, Alex! You found every vehicle!';document.getElementById('replay-actions').hidden=false;}
})();
</script></body></html>
