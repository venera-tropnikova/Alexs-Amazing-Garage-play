<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>Watch Mission — Alex's Amazing Garage</title>
<style>
:root{
  --ink:#173254;
  --ink-deep:#0f2438;
  --paper:#f4e6cf;
  --paper-2:#f8ecd9;
  --gold:#ffcc35;
  --gold-deep:#d69a00;
  --blue:#2f95ff;
  --blue-deep:#1767c6;
  --red:#f44747;
  --red-deep:#b92c2c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
  color:#13213a;
  background:linear-gradient(180deg,#f7ecd9 0%,#efdfc3 100%);
}
a{text-decoration:none}
.mission-shell{min-height:100svh;display:flex;flex-direction:column;padding:10px 14px 18px}
.mission-topbar{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  background:linear-gradient(180deg,#faebc6 0%,#efd48a 100%);
  border:2px solid #f1bf2a;
  border-radius:20px;
  box-shadow:0 8px 20px rgba(69,49,9,.12);
}
.nav-left,.nav-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav-right{justify-content:flex-end}
.top-btn{
  min-height:44px;
  padding:0 16px;
  border-radius:14px;
  border:2px solid var(--blue-deep);
  background:linear-gradient(180deg,#37a7ff 0%,#2485e8 100%);
  color:#fff;
  font:800 18px/1 "Trebuchet MS","Segoe UI",sans-serif;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 3px 0 var(--blue-deep);
}
.top-btn.icon{min-width:44px;padding:0 10px}
.top-btn.find{background:linear-gradient(180deg,#ff6767 0%,#ef3131 100%);border-color:var(--red-deep);box-shadow:0 3px 0 var(--red-deep)}
.top-btn.watch{background:linear-gradient(180deg,#ffd454 0%,#ffbd1f 100%);border-color:var(--gold-deep);box-shadow:0 3px 0 var(--gold-deep);color:#5b3800}
.top-btn.back{min-width:170px}
.title-pill{
  min-width:min(340px,90vw);
  padding:10px 22px;
  border-radius:18px;
  border:2px solid var(--blue-deep);
  background:linear-gradient(180deg,#38abff 0%,#2485e8 100%);
  color:#fff;
  font:900 clamp(28px,3.2vw,44px)/1 "Trebuchet MS","Segoe UI",sans-serif;
  text-align:center;
  box-shadow:0 4px 0 var(--blue-deep);
}
.player-wrap{flex:1;display:flex;justify-content:center;padding-top:14px}
.player-card{
  width:min(1180px,100%);
  background:linear-gradient(180deg,#f7ead5 0%,#f1e0c1 100%);
  border:3px solid #f0c64c;
  border-radius:28px;
  box-shadow:0 16px 32px rgba(31,33,39,.14);
  padding:22px clamp(14px,2.8vw,34px) 24px;
}
.eyebrow{margin:0 0 4px;color:#7c5d1c;font:800 15px/1.2 "Trebuchet MS","Segoe UI",sans-serif;letter-spacing:.02em}
#title{margin:0;color:#173254;font-size:clamp(31px,4vw,52px);line-height:1.06}
#description{margin:10px 0 18px;color:#314b6d;font-size:clamp(18px,2.2vw,28px);font-weight:700}
.video-frame{
  width:100%;
  border-radius:24px;
  border:4px solid #237cd8;
  overflow:hidden;
  background:#0f1f31;
  box-shadow:0 14px 28px rgba(16,36,56,.22);
  aspect-ratio:16/9;
}
video{display:block;width:100%;height:100%;object-fit:contain;background:#07111d}
.error{min-height:1.5em;margin:12px 0 0;color:#b62626;font-weight:800;font-size:18px}
.actions{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:18px}
.switch{
  min-height:56px;
  min-width:220px;
  padding:0 22px;
  border:2px solid var(--gold-deep);
  border-radius:18px;
  background:linear-gradient(180deg,#ffd455 0%,#ffbd20 100%);
  color:#563300;
  font:900 20px/1 "Trebuchet MS","Segoe UI",sans-serif;
  box-shadow:0 4px 0 var(--gold-deep);
  cursor:pointer;
}
.switch:hover,.top-btn:hover,.title-pill:hover{filter:brightness(1.03)}
.switch:disabled{opacity:.45;cursor:not-allowed}
.help{margin:16px 0 0;color:#4c6281;font:700 18px/1.35 "Trebuchet MS","Segoe UI",sans-serif}
@media (max-width:1050px){
  .mission-topbar{grid-template-columns:1fr;justify-items:center}
  .nav-left,.nav-right{justify-content:center}
  .nav-right{width:100%}
  .title-pill{min-width:min(320px,100%)}
}
@media (max-width:700px){
  .mission-shell{padding:8px}
  .player-card{padding:16px 12px 18px}
  .top-btn{font-size:16px;min-height:42px;padding:0 12px}
  .switch{flex:1 1 100%;min-width:0;font-size:18px;min-height:52px}
  .actions{justify-content:stretch}
}
</style>
<style id="alex-clean-video-header-v1">
/* The machine name is already displayed in the game's top bar. */
.player-card > .eyebrow,
.player-card > #title,
.player-card > #description { display: none !important; }
.player-wrap { padding-top: 8px !important; }
.player-card { padding-top: 12px !important; }
.video-frame { margin: 0 auto !important; width: min(100%, calc((100dvh - 220px) * 16 / 9)) !important; }
@media (max-width: 700px) {
  .video-frame { width: 100% !important; }
}
</style>
</head>
<body>
<main class="mission-shell">
  <header class="mission-topbar" aria-label="Mission navigation">
    <div class="nav-left">
      <a class="top-btn icon" href="../../index.html" aria-label="Home">🏠</a>
      <a class="top-btn" href="../../garage.html">Garage</a>
      <a class="top-btn find" id="findIt" href="../../find-it.html?v=fire-truck">Find It!</a>
      <a class="top-btn watch" href="#" aria-current="page">▶ Watch Mission</a>
    </div>
    <div class="title-pill" id="titlePill">Watch Mission</div>
    <div class="nav-right">
      <a id="backExplore" class="top-btn back" href="../../preview/vehicle-explore/explore.html?v=fire-truck">← Back to Explore</a>
    </div>
  </header>

  <section class="player-wrap">
    <div class="player-card">
      <p class="eyebrow">Alex's Amazing Garage</p>
      <h1 id="title">Watch Mission</h1>
      <p id="description">Watch the vehicle in action!</p>
      <div class="video-frame"><video id="film" controls playsinline preload="metadata" aria-label="Mission video"></video></div>
      <p class="error" id="error" role="status"></p>
      <div class="actions">
        <button id="previous" class="switch" type="button">← Previous Mission</button>
        <button id="next" class="switch" type="button">Next Mission →</button>
      </div>
      <p class="help">Press Play to watch the mission video. Use Previous and Next to move through all vehicles.</p>
    </div>
  </section>
</main>
<script>
'use strict';
const fleet = [
  {id:'fire-truck',title:'Fire Truck',file:'fire-truck-kitten-rescue-01.mp4'},
  {id:'airport-fire-truck',title:'Airport Fire Truck',file:'airport-fire-truck-aircraft-rescue-01.mp4'},
  {id:'police-car',title:'Police Car',file:'police-car-lost-puppy-01.mp4'},
  {id:'excavator',title:'Excavator',file:'excavator-loading-dump-truck-01.mp4'},
  {id:'mobile-crane',title:'Mobile Crane',file:'mobile-crane-lifting-beam-01.mp4'},
  {id:'tractor',title:'Tractor',file:'tractor-pumpkin-farm-01.mp4'},
  {id:'dump-truck',title:'Dump Truck',file:'dump-truck-unloading-soil-01.mp4'},
  {id:'mars-rover',title:'Mars Rover',file:'mars-rover-rock-analysis-01.mp4'},
  {id:'ambulance',title:'Ambulance',file:'ambulance-patient-rescue-01.mp4'}
];
const params = new URLSearchParams(location.search);
const key = params.get('v') || 'fire-truck';
let index = fleet.findIndex(v => v.id === key);
if (index < 0) index = 0;
const item = fleet[index];
const title = document.getElementById('title');
const titlePill = document.getElementById('titlePill');
const description = document.getElementById('description');
const backExplore = document.getElementById('backExplore');
const findIt = document.getElementById('findIt');

document.title = item.title + ' Mission — Alex\'s Amazing Garage';
title.textContent = item.title + ' Mission';
titlePill.textContent = item.title;
description.textContent = 'Watch the ' + item.title.toLowerCase() + ' in action!';
backExplore.href = '../../preview/vehicle-explore/explore.html?v=' + encodeURIComponent(item.id);
findIt.href = '../../find-it.html?v=' + encodeURIComponent(item.id);

const film = document.getElementById('film');
film.src = 'assets/' + item.file;
film.addEventListener('error', () => {
  document.getElementById('error').textContent = 'Video unavailable. Please check that all mission files were installed.';
});

const previous = document.getElementById('previous');
const next = document.getElementById('next');
previous.disabled = index === 0;
next.disabled = index === fleet.length - 1;
previous.onclick = () => { if (index > 0) location.href = '?v=' + encodeURIComponent(fleet[index - 1].id); };
next.onclick = () => { if (index < fleet.length - 1) location.href = '?v=' + encodeURIComponent(fleet[index + 1].id); };
</script>
</body>
</html>
