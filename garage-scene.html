<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alex's Amazing Garage</title>
  <link rel="stylesheet" href="public/truck-screen.css">
</head>
<body>
  <main class="garage-scene">
    <h1 class="sr-only">Choose a vehicle</h1>
    <div class="garage-scene-stage">
      <img class="garage-scene-bg" src="public/images/truck-36822-art/wide_high_resolution_cinematic_clean_and_colorf.png" alt="" width="1536" height="1024">
      <a class="scene-back" href="index.html" aria-label="Cover">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M14.5 5.5 L8 12 L14.5 18.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <a class="scene-bay scene-bay-1" href="truck.html?test=local" aria-label="Pierce Velocity Ascendant">
        <img src="public/images/truck-36822-art/fire-truck-transparent.png" alt="" width="2440" height="955">
      </a>
      <a class="scene-bay scene-bay-2" href="panther.html?test=local" aria-label="Rosenbauer Panther 6x6">
        <img src="public/images/truck-36822-art/scene-cutouts/panther-cutout.png" alt="" width="1954" height="1070">
      </a>
      <a class="scene-bay scene-bay-3" href="ford-police.html?test=local" aria-label="Ford Police Interceptor Utility">
        <img src="public/images/truck-36822-art/Ford Police Interceptor Utility.png" alt="" width="1649" height="854">
      </a>
      <a class="scene-bay scene-bay-4" href="caterpillar.html?test=local" aria-label="Caterpillar 320">
        <img src="public/images/truck-36822-art/caterpillar-320.png" alt="" width="2004" height="785">
      </a>
      <a class="scene-bay scene-bay-5" href="liebherr.html?test=local" aria-label="Liebherr LTM 1090-4.2">
        <img src="public/images/truck-36822-art/liebherr-ltm-1090-4-2.png" alt="" width="1817" height="866">
      </a>
      <a class="scene-bay scene-bay-6" href="john-deere.html?test=local" aria-label="John Deere 8R 410">
        <img src="public/images/truck-36822-art/John Deere 8R 410.png" alt="" width="1536" height="1024">
      </a>
      <a class="scene-bay scene-bay-7" href="volvo-a40g.html?test=local" aria-label="Volvo A40G">
        <img src="public/images/truck-36822-art/Volvo A40G.png" alt="" width="1671" height="910">
      </a>
      <a class="scene-bay scene-bay-8" href="perseverance.html?test=local" aria-label="NASA Perseverance">
        <img src="public/images/truck-36822-art/scene-cutouts/perseverance-cutout.png" alt="" width="1283" height="680">
      </a>
      <a class="scene-bay scene-bay-9" href="ford-f450.html?test=local" aria-label="Ford F-450 Ambulance">
        <img src="public/images/truck-36822-art/ford-f450-ambulance.png" alt="" width="1536" height="1024">
      </a>
    </div>

</html>
